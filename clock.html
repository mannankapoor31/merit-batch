<!DOCTYPE html>
<html>
<head>
    <title>Display Date and Time</title>
</head>

<body>

    <h1>Display Current Date and Time</h1>

    <button onclick="displayDate()">Display Date and Time</button>

    <h2 id="date"></h2>

    <script>
        function displayDate()
        {
            var d = new Date();

            document.getElementById("date").innerHTML =
                "Current Date and Time: " + d;
        }
    </script>

</body>
</html>

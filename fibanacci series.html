<!DOCTYPE html>
<html>
<head>
    <title>Fibonacci Series</title>
</head>

<body>

    <h2>Fibonacci Series</h2>

    <script>
        var n = Number(prompt("Enter the number of terms:"));

        var a = 0;
        var b = 1;

        for (var i = 0; i < n; i++)
        {
            document.write(a + "<br>");

            var c = a + b;
            a = b;
            b = c;
        }
    </script>

</body>
</html>
